<button class="button" onclick="resetParameters()">Reset</button>

    <script>
const fieldDefaults = {
    seed: 31415,
    strands: 72,
    amplitude: 42,
    twist: 1.15,
    colorPalette: ['#a95137', '#376b67', '#8b784b'],
};
/** One deterministic geometry source for the build-time SVG and the p5.js viewer. */
function generateField(input = fieldDefaults) {
    const strands = Math.round(Math.max(24, Math.min(100, input.strands)));
    const amplitude = Math.max(10, Math.min(65, input.amplitude));
    const twist = Math.max(0.4, Math.min(2, input.twist));
    let state = input.seed >>> 0 || 1;
    const random = () => {
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        return state / 4294967296;
    };
    const phase = random() * Math.PI * 2;
    const rotation = -0.45 + random() * 0.25;
    const harmonic = random() * Math.PI * 2;
    const palette = input.colorPalette.length ? input.colorPalette : fieldDefaults.colorPalette;
    const result = [];
    for (let i = 0; i < strands; i++) {
        const lane = i / (strands - 1);
        const points = [];
        for (let j = 0; j <= 180; j++) {
            const t = (j / 180) * Math.PI * 2;
            const r = 91 + lane * 103 + amplitude * Math.sin(2 * t + phase + lane * twist);
            const x = r * Math.cos(t) + 20 * Math.sin(3 * t + harmonic) * lane;
            const y = r * Math.sin(t) * 0.92 + 32 * Math.sin(t * 2 + lane * twist);
            points.push([
                Number((300 + 0.85 * (x * Math.cos(rotation) - y * Math.sin(rotation))).toFixed(2)),
                Number((270 + 0.85 * (x * Math.sin(rotation) + y * Math.cos(rotation))).toFixed(2)),
            ]);
        }
        result.push({
            points,
            color: palette[Math.min(palette.length - 1, Math.floor(lane * palette.length))],
            opacity: 0.52 + Math.sin(lane * Math.PI) * 0.22,
            weight: i % 13 === 0 ? 1.35 : 0.8,
        });
    }
    return result;
}

let params = structuredClone(fieldDefaults);
let artCanvas;
let pendingFrame;
function setup() {
  pixelDensity(1);
  artCanvas = createCanvas(1200, 1080);
  artCanvas.parent('canvas-container');
  artCanvas.elt.setAttribute('role', 'img');
  artCanvas.elt.setAttribute('aria-label', '迭代成形：由种子和参数生成的环形曲线');
  noLoop();
  syncControls();
  initializeSystem();
  document.querySelector('.loading').style.display = 'none';
}
function initializeSystem() {
  if (!artCanvas) return;
  randomSeed(params.seed);
  noiseSeed(params.seed);
  background('#faf9f5');
  push();
  scale(2);
  noFill();
  for (const strand of generateField(params)) {
    const ink = color(strand.color);
    ink.setAlpha(strand.opacity * 255);
    stroke(ink);
    strokeWeight(strand.weight);
    beginShape();
    for (const [x, y] of strand.points) vertex(x, y);
    endShape(CLOSE);
  }
  pop();
  artCanvas.elt.dataset.seed = String(params.seed);
}
function draw() {}
function scheduleRender() {
  cancelAnimationFrame(pendingFrame);
  pendingFrame = requestAnimationFrame(initializeSystem);
}
function updateParam(name, value) {
  const input = document.getElementById(name);
  params[name] = Math.min(Number(input.max), Math.max(Number(input.min), Number(value)));
  document.getElementById(name + '-value').textContent = params[name];
  scheduleRender();
}
function updateColor(id, value) {
  params.colorPalette[Number(id.slice(-1)) - 1] = value;
  document.getElementById(id + '-value').textContent = value;
  scheduleRender();
}
        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }


function syncControls() {
  for (const name of ['strands', 'amplitude', 'twist']) {
    document.getElementById(name).value = params[name];
    document.getElementById(name + '-value').textContent = params[name];
  }
  params.colorPalette.forEach((value, i) => {
    document.getElementById('color' + (i + 1)).value = value;
    document.getElementById('color' + (i + 1) + '-value').textContent = value;
  });
  updateSeedDisplay();
}
function resetParameters() {
  params = structuredClone(fieldDefaults);
  syncControls();
  initializeSystem();
}
function downloadArt() {
  if (artCanvas) saveCanvas(artCanvas, 'iterative-form-' + params.seed, 'png');
}
window.addEventListener('load', function() {
  syncControls();
  if (typeof window.p5 === 'undefined') {
    document.querySelector('.loading').textContent = '画布资源未能加载。请联网后重试，或返回知识库继续学习。';
    document.querySelectorAll('button, input').forEach(el => el.disabled = true);
  }
});
</script>
