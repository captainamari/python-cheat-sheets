name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: [pages, vercel]
    env:
      DEPLOY_TARGET: ${{ matrix.deployment }}
      VERCEL_PROJECT_PRODUCTION_URL: python-cheat-sheets.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:outputs
      - run: npm run build
      - run: npm run test:site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
