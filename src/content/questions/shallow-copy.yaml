topicId: shallow-copy
questions:
  - type: mcq
    prompt: 对 list[dict] 做列表浅拷贝后，通常哪个关系成立？
    choices:
      - id: a
        text: 外层列表与原列表相同
      - id: b
        text: 内部字典与原字典共享
      - id: c
        text: 所有嵌套对象都已独立
      - id: d
        text: 修改新列表长度必改原列表
    correct: b
    explanation: 浅拷贝新建外层容器，但复制的是成员引用，因此列表内部的字典仍是共享对象。
    id: shallow-copy-mcq
    topicId: shallow-copy
  - type: output
    prompt: 下面浅拷贝操作会输出什么？
    code: 'a = [[1], [2]]

      b = a.copy()

      b[0].append(3)

      b.append([4])

      print(a)'
    answer: '[[1, 3], [2]]'
    explanation: 修改 b[0] 触及共享的内部列表；向 b 追加新成员只改变新外层容器，不改变 a 的长度。
    id: shallow-copy-output
    topicId: shallow-copy
  - type: debug
    prompt: 测试之间嵌套配置串扰，应该在哪一层隔离？
    code:
      "template = {\"headers\": {\"mode\": \"safe\"}}\ndef make_config():\n    return template.copy()\n\
      a = make_config()\na[\"headers\"][\"mode\"] = \"fast\""
    rubric:
      - 指出 headers 字典仍然共享
      - 可显式复制 headers 或对纯数据配置使用 deepcopy
      - 验证修改 a 后模板及另一次配置不变
    explanation: 只复制外层字典无法隔离嵌套写入。应根据数据结构复制真正被修改的层，并在测试中检查模板未被污染。
    id: shallow-copy-debug
    topicId: shallow-copy
  - type: oral
    prompt: 什么时候选择浅拷贝，什么时候选择深拷贝？
    rubric:
      - 从修改边界与对象图解释差异
      - 说明循环引用和共享关系由 memo 处理
      - 讨论资源对象与复制成本
    explanation: 完整回答需要说明适用条件。深拷贝适合需要隔离的可复制数据图，不能替代对接口状态边界的设计。
    id: shallow-copy-oral
    topicId: shallow-copy
