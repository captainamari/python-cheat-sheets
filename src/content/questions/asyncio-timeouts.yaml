topicId: asyncio-timeouts
questions:
- type: mcq
  prompt: wait_for 超过期限后，为什么实际返回时间还可能更晚？
  choices:
  - id: a
    text: 它会强制杀死所有执行线程后立即返回
  - id: b
    text: 设定值只影响日志，不会请求取消
  - id: c
    text: 它还可能等待被取消任务完成清理
  correct: c
  explanation: asyncio.timeout 为一段等待设置截止时间，在上下文边界把由超时引起的取消转换成 TimeoutError，因此通常在 with 外捕获。wait_for 则围绕一个可等待对象工作，超时时取消并等待其响应，实际耗时可能超过设定值。两者都需要事件循环有机会运行取消逻辑。
  id: asyncio-timeouts-mcq
  topicId: asyncio-timeouts
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "import asyncio\nasync def main():\n    try:\n        async with asyncio.timeout(0):\n            await asyncio.sleep(0)\n    except TimeoutError:\n        print('timed out')\nasyncio.run(main())\n"
  answer: timed out
  explanation: 超时是预算与取消协议，不是抢占式杀死代码。我会让阻塞操作使用合适的执行边界，配置底层超时，并把异常捕获放在正确的上下文外。测试覆盖超时触发、清理和外部操作结果未知，而不只检查墙钟数字。
  id: asyncio-timeouts-output
  topicId: asyncio-timeouts
- type: debug
  prompt: 协程设置超时却无法及时生效，下面的阻塞点是什么？
  code: "import asyncio, time\nasync def work():\n    async with asyncio.timeout(1):\n        time.sleep(5)"
  rubric:
  - 解释协作式取消及超时上下文外的异常捕获
  - 移出事件循环阻塞调用并验证底层超时与清理行为
  explanation: 把 time.sleep 放进 async def 会阻塞事件循环，超时回调也无法准时执行。把工作放到线程后取消等待者，也不代表能强制杀死正在执行的线程函数。吞掉 CancelledError 可能破坏上层超时与任务组语义；清理应有边界并继续传播取消，除非明确实现了可恢复协议。
  id: asyncio-timeouts-debug
  topicId: asyncio-timeouts
- type: oral
  prompt: 请求总超时、单次下游超时和重试预算应该如何配合？
  rubric:
  - 解释协作式取消及超时上下文外的异常捕获
  - 移出事件循环阻塞调用并验证底层超时与清理行为
  - 超时是预算与取消协议，不是抢占式杀死代码。我会让阻塞操作使用合适的执行边界，配置底层超时，并把异常捕获放在正确的上下文外。测试覆盖超时触发、清理和外部操作结果未知，而不只检查墙钟数字。
  explanation: 一个请求访问多个下游时，应该把总预算和每次调用预算区分开，重试也消耗总预算。数据库驱动或 HTTP 客户端自身的连接与读取超时仍需设置，外层协程取消不一定等价于远端工作停止。对已提交的写操作还要考虑结果未知和重试幂等性。
  id: asyncio-timeouts-oral
  topicId: asyncio-timeouts
