topicId: weak-references
questions:
- type: mcq
  prompt: 弱值字典与普通字典的关键差别是什么？
  choices:
  - id: a
    text: 会自动把所有对象复制成独立副本
  - id: b
    text: 能让所有内置类型支持弱引用
  - id: c
    text: 不会仅因值被索引就保证它持续存活
  correct: c
  explanation: 普通字典的值是强引用，会让对象至少活到条目删除或字典释放。弱值字典只保留弱引用，当其他强引用都消失且对象被回收时，对应条目可自动移除。weakref.ref 返回的可调用对象会给出目标或 None，调用后应把结果存到局部变量，再进行使用。
  id: weak-references-mcq
  topicId: weak-references
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "import gc\nimport weakref\nclass Item:\n    pass\nitem = Item()\ncache = weakref.WeakValueDictionary()\ncache['x'] = item\nprint('x' in cache)\ndel item\ngc.collect()\nprint('x' in cache)\n"
  answer: 'True

    False'
  explanation: 弱引用表达的是观察而不拥有。它适合辅助索引，不适合保证保留的数据。访问时取一次引用并检查 None，测试对象存在和消失两条路径；发现内存问题时还要检查其他强引用，而不是只换一个容器类型。
  id: weak-references-output
  topicId: weak-references
- type: debug
  prompt: 检查后再取一次弱引用，哪里存在生命周期漏洞？
  code: "def use(ref):\n    if ref() is not None:\n        return ref().name"
  rubric:
  - 解释弱引用不拥有目标生命周期及可能未命中
  - 把 ref() 的结果保存一次并检查 None 后再使用
  explanation: 不要先调用 ref() 判断非空，再第二次调用它使用，目标可能在两次调用之间消失。弱引用支持也有类型边界，例如部分内置类型不能直接弱引用，使用 slots 的类可能需要 __weakref__。回调中如果通过闭包强引用目标，反而可能破坏原本想缩短生命周期的设计。
  id: weak-references-debug
  topicId: weak-references
- type: oral
  prompt: 什么样的缓存适合弱引用，什么样的保留承诺不适合？
  rubric:
  - 解释弱引用不拥有目标生命周期及可能未命中
  - 把 ref() 的结果保存一次并检查 None 后再使用
  - 弱引用表达的是观察而不拥有。它适合辅助索引，不适合保证保留的数据。访问时取一次引用并检查 None，测试对象存在和消失两条路径；发现内存问题时还要检查其他强引用，而不是只换一个容器类型。
  explanation: 对象注册表、观察者和某些派生缓存适合弱引用，因为索引不应该成为对象长期存活的唯一原因。业务缓存若承诺条目在一段时间内一定存在，就需要明确拥有数据，并配套容量与过期策略；弱引用不会代替这些规则，也不能保证热门对象一直留在缓存里。
  id: weak-references-oral
  topicId: weak-references
