topicId: async-condition
questions:
- type: mcq
  prompt: Condition 等待者被唤醒后，最重要的下一步是什么？
  choices:
  - id: a
    text: 假定自己一定拥有一份资源
  - id: b
    text: 立即清空所有共享状态
  - id: c
    text: 在持锁状态重新检查业务谓词
  correct: c
  explanation: 等待者持有条件锁后调用 wait，会暂时释放锁并挂起，返回前重新取得锁。通知者在同一同步协议下更新状态并 notify，等待者醒来时可能已经有其他任务先消费了资源。因此通知不是资源所有权，wait_for 会反复检查谓词，直到当前状态真正满足要求。
  id: async-condition-mcq
  topicId: async-condition
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "import asyncio\nasync def main():\n    condition = asyncio.Condition()\n    state = {'ready': False}\n    async def produce():\n        async with condition:\n            state['ready'] = True\n            condition.notify_all()\n    task = asyncio.create_task(produce())\n    async with condition:\n        await condition.wait_for(lambda: state['ready'])\n        print(state['ready'])\n    await task\nasyncio.run(main())\n"
  answer: 'True'
  explanation: 我把 Condition 的通知看成重新检查的提示，真正决定继续的是受锁保护的谓词。更新、通知、再次检查使用同一协议。验证多等待者竞争和取消，不把被唤醒误认为已获得业务资源。
  id: async-condition-output
  topicId: async-condition
- type: debug
  prompt: 多个等待者醒来后其中一个取空列表，应该如何处理？
  code: "async with condition:\n    await condition.wait()\n    item = items.pop()"
  rubric:
  - 解释等待时释放锁与返回前重新取得锁
  - 使用谓词循环并让状态更新和消费遵守同一同步协议
  explanation: 不持有锁就 notify 或等待会违反原语要求；只在锁外检查一次再进入等待，也可能错过状态变化。notify_all 会让所有等待者重新竞争，并不保证每个人都能得到资源。测试应构造多个等待者与少量资源，验证只有满足条件者继续，并为永远无法满足的条件设计取消或超时。
  id: async-condition-debug
  topicId: async-condition
- type: oral
  prompt: notify_all 为什么不保证每个被唤醒的任务都能成功消费一个资源？
  rubric:
  - 解释等待时释放锁与返回前重新取得锁
  - 使用谓词循环并让状态更新和消费遵守同一同步协议
  - 我把 Condition 的通知看成重新检查的提示，真正决定继续的是受锁保护的谓词。更新、通知、再次检查使用同一协议。验证多等待者竞争和取消，不把被唤醒误认为已获得业务资源。
  explanation: 缓冲区达到阈值、阶段状态变化或共享集合变为非空时，可以用 Condition 表达等待关系。业务状态的读取和修改都需要遵守同一把锁，才能让检查与后续操作保持一致。若只是传递独立任务，Queue 已经封装了很多账目与等待逻辑，通常比手写条件变量更容易维护。
  id: async-condition-oral
  topicId: async-condition
