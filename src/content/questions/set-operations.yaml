topicId: set-operations
questions:
- type: mcq
  prompt: 需要按首次出现顺序去重，哪种写法更符合契约？
  choices:
  - id: a
    text: list(dict.fromkeys(values))
  - id: b
    text: list(set(values)) 保证原顺序
  - id: c
    text: sorted(set(values)) 保证首次出现顺序
  correct: a
  explanation: 集合按哈希与相等关系判断元素是否重复，因此元素必须可哈希，等值对象会合并。交集、并集、差集与对称差表达成员关系，不表达排列关系。把列表转成集合再转回列表，得到的是唯一成员的一次遍历结果，不保证与原列表首次出现顺序相同。
  id: set-operations-mcq
  topicId: set-operations
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: 'values = [''b'', ''a'', ''b'']

    print(sorted(set(values)))

    print(list(dict.fromkeys(values)))

    print(sorted({1, 2} ^ {2, 3}))

    '
  answer: '[''a'', ''b'']

    [''b'', ''a'']

    [1, 3]'
  explanation: 我把集合用于成员关系，把字典顺序用于稳定去重，把 Counter 用于频次。去重前先判断重复是否有业务意义。验证关注成员和保留规则，输出展示显式排序，避免把实现中的遍历顺序当契约。
  id: set-operations-output
  topicId: set-operations
- type: debug
  prompt: 导出顺序每次可能变化，为什么集合去重不够？
  code: "def unique(values):\n    return list(set(values))\n# 需求要求保留输入首次出现的顺序"
  rubric:
  - 区分唯一成员、顺序与重复次数
  - 使用有序去重或显式排序，并保留有业务意义的重复信息
  explanation: 空集合写成 set()，{} 是空字典。集合包含可变列表会报错，frozenset 可以表达不可变且可哈希的集合，但它并不自动让元素变得可哈希。也不要把集合的某次打印顺序写成输出题答案；本例在展示成员时使用 sorted，使结果跨进程可重复。
  id: set-operations-debug
  topicId: set-operations
- type: oral
  prompt: 什么时候应该使用 set，什么时候应该保留 Counter 或原始明细？
  rubric:
  - 区分唯一成员、顺序与重复次数
  - 使用有序去重或显式排序，并保留有业务意义的重复信息
  - 我把集合用于成员关系，把字典顺序用于稳定去重，把 Counter 用于频次。去重前先判断重复是否有业务意义。验证关注成员和保留规则，输出展示显式排序，避免把实现中的遍历顺序当契约。
  explanation: 比较两个批次的用户 ID 时，集合适合找新增、删除和共同成员。生成面向用户的稳定报告时，应显式排序或使用 list(dict.fromkeys(values)) 保留首次出现顺序。若重复本身代表错误、权重或次数，就不能简单去掉；需要保存计数并报告重复来源，避免清洗过程删除了重要业务信息。
  id: set-operations-oral
  topicId: set-operations
