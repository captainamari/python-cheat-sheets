topicId: async-mock
questions:
- type: mcq
  prompt: 哪种断言能更直接发现异步方法被调用却没有被等待？
  choices:
  - id: a
    text: 只用 assert_called_once
  - id: b
    text: 只检查 mock 的属性是否存在
  - id: c
    text: assert_awaited_once_with
  correct: c
  explanation: 普通异步函数被调用时创建协程，只有被等待或调度后才执行函数体。AsyncMock 对应这种分离：call_count 记录调用，await_count 记录结果被等待。return_value 是等待之后得到的值，side_effect 也可以在等待阶段抛出异常或产生结果。
  id: async-mock-mcq
  topicId: async-mock
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "import asyncio\nfrom unittest.mock import AsyncMock\nasync def main():\n    fetch = AsyncMock(return_value='ok')\n    pending = fetch('key')\n    print(fetch.call_count, fetch.await_count)\n    print(await pending)\n    print(fetch.await_count)\nasyncio.run(main())\n"
  answer: '1 0

    ok

    1'
  explanation: 调用异步函数与等待它是两个阶段。AsyncMock 分别记录，我会验证等待次数和参数，并检查结果与失败路径。漏 await 的问题要从实际业务输出和 await 断言发现，不能只看方法被触发。
  id: async-mock-output
  topicId: async-mock
- type: debug
  prompt: 测试说调用正确但函数返回协程对象，漏了什么？
  code: "async def load(client):\n    return client.fetch('key')\n# 测试仅调用 client.fetch.assert_called_once()"
  rubric:
  - 区分调用计数与等待计数
  - 在正确位置 await 并断言等待参数及实际返回值
  explanation: 把同步 Mock 塞给需要 await 的调用点可能抛 TypeError，反过来把 AsyncMock 用在同步接口上又可能产生未等待协程。替身类型应匹配真实接口；异步上下文管理和异步迭代还涉及 __aenter__、__aexit__、__aiter__ 等不同协议，不能只设置普通 return_value 就认为全部模拟完成。
  id: async-mock-debug
  topicId: async-mock
- type: oral
  prompt: 异步函数、异步上下文管理器和异步迭代器的替身为什么不能混为一谈？
  rubric:
  - 区分调用计数与等待计数
  - 在正确位置 await 并断言等待参数及实际返回值
  - 调用异步函数与等待它是两个阶段。AsyncMock 分别记录，我会验证等待次数和参数，并检查结果与失败路径。漏 await 的问题要从实际业务输出和 await 断言发现，不能只看方法被触发。
  explanation: 测试异步服务时，可以替换下游 async 方法，验证 await 参数、成功映射与取消或超时传播。若业务代码遗漏 await，assert_called_once 仍可能通过，但结果根本没有被消费。需要断言实际返回值和 assert_awaited_once_with，必要时检查取消后资源释放，而不仅是替身的计数。
  id: async-mock-oral
  topicId: async-mock
