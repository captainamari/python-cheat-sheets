topicId: random-reproducibility
questions:
- type: mcq
  prompt: 固定 seed 后，为什么并发任务仍可能拿到不同样本？
  choices:
  - id: a
    text: seed 会自动随时间变化
  - id: b
    text: 调度改变了各任务消费随机数的顺序
  - id: c
    text: Random 实例不能生成整数
  correct: b
  explanation: random 模块的顶层函数使用共享生成器，任何测试多调用一次都会推进状态，影响后续结果。random.Random(seed) 创建独立生成器，让被测代码通过参数接收它，可以隔离其他用例的随机调用。相同状态和相同调用序列产生相同结果；getstate 与 setstate 可以在同一受支持运行环境中保存和恢复状态。示例不依赖特定随机数字，而是验证两个实例的一致性和状态回放。
  id: random-reproducibility-mcq
  topicId: random-reproducibility
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: 'import random

    left = random.Random(7)

    right = random.Random(7)

    print([left.randrange(100) for _ in range(4)] == [right.randrange(100) for _ in range(4)])

    state = left.getstate()

    value = left.random()

    left.setstate(state)

    print(left.random() == value)

    print(0 <= value < 1)

    '
  answer: 'True

    True

    True'
  explanation: 我注入独立随机生成器，记录 seed 与版本，并保存失败输入。固定 seed 只控制初始状态，还需控制调用顺序和算法。测试主要验证不变量，安全令牌使用 secrets，不把可复现的 random 当作安全随机源。
  id: random-reproducibility-output
  topicId: random-reproducibility
- type: debug
  prompt: 下面测试共享全局 random 有什么隐藏耦合？
  code: 'random.seed(7)

    result_a = make_case()

    write_random_sample_log()

    result_b = make_case()'
  rubric:
  - 向生成函数注入独立 Random，控制调用顺序并记录版本和 seed
  - 保存失败输入，断言不变量，区分测试随机与 secrets 安全用途
  explanation: 固定 seed 不代表跨所有 Python 版本和所有高层算法永久得到同样的序列，随机模块对兼容性的保证有具体范围。不要把大量精确随机输出快照当成业务合同，优先断言范围、不变量和可回放失败样本。密码、令牌等安全用途使用 secrets，不使用可预测的伪随机生成器；统计可复现和安全不可预测是不同目标。
  id: random-reproducibility-debug
  topicId: random-reproducibility
- type: oral
  prompt: 如何让随机化测试失败可重现，同时避免脆弱的随机值快照？
  rubric:
  - 向生成函数注入独立 Random，控制调用顺序并记录版本和 seed
  - 保存失败输入，断言不变量，区分测试随机与 secrets 安全用途
  - 我注入独立随机生成器，记录 seed 与版本，并保存失败输入。固定 seed 只控制初始状态，还需控制调用顺序和算法。测试主要验证不变量，安全令牌使用 secrets，不把可复现的 random 当作安全随机源。
  explanation: 随机化测试失败时记录 seed、输入样本、解释器和相关库版本，重现时直接保存最小失败输入通常比只保存 seed 更可靠。测试数据生成与产品随机策略应分开注入，避免一个新增日志抽样调用改变所有后续样本。并发场景中即使生成器本身能工作，线程调度改变调用顺序也会影响哪个任务拿到哪个随机数。
  id: random-reproducibility-oral
  topicId: random-reproducibility
