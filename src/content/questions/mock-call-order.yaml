topicId: mock-call-order
questions:
- type: mcq
  prompt: assert_has_calls(expected) 默认是否禁止 expected 前后存在其他调用？
  choices:
  - id: a
    text: 禁止，必须与整个列表完全相等
  - id: b
    text: 不禁止，它允许前后额外调用
  - id: c
    text: 它完全不关心顺序
  correct: b
  explanation: 单独检查两个 Mock 都被调用过，不能证明先后顺序。把它们通过 attach_mock 绑定到同一父对象后，父对象的 mock_calls 会记录带名称的调用序列。示例把保存和通知挂到 parent，先执行保存再发送通知，最后比较精确列表。这里断言的不是实现细节中的每一步，而是“通知前必须完成持久化”这种可观察的业务顺序。
  id: mock-call-order-mcq
  topicId: mock-call-order
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: 'from unittest.mock import Mock, call

    parent = Mock()

    save = Mock()

    notify = Mock()

    parent.attach_mock(save, ''save'')

    parent.attach_mock(notify, ''notify'')

    save(7)

    notify(7)

    print(parent.mock_calls == [call.save(7), call.notify(7)])

    print(parent.mock_calls == [call.notify(7), call.save(7)])

    '
  answer: 'True

    False'
  explanation: 我用共同父 Mock 收集跨依赖调用，再按业务需要选择精确列表或局部顺序断言。调用过不等于顺序正确，调用开始也不等于异步完成。只有提交前后等真正影响结果的顺序才应该成为测试契约。
  id: mock-call-order-output
  topicId: mock-call-order
- type: debug
  prompt: 下面两个断言为什么无法发现通知先于保存的错误？
  code: 'save.assert_called_once_with(record)

    notify.assert_called_once_with(record)'
  rubric:
  - 用 attach_mock 汇总跨依赖顺序，按约束比较调用列表
  - 区分精确顺序、局部顺序与异步完成关系
  explanation: 调用顺序记录只说明 Mock 被调用的顺序，不自动证明异步操作已完成；协程还需使用 AsyncMock 的 await 断言或可控事件验证完成关系。精确比较也会受到链式调用记录影响，应该让测试关注稳定接口。不要为了让用例通过而给被测代码增加没有业务意义的固定顺序，测试应该表达真实需求。
  id: mock-call-order-debug
  topicId: mock-call-order
- type: oral
  prompt: 怎样测试“保存成功后才能通知”，又避免把所有内部实现顺序都锁死？
  rubric:
  - 用 attach_mock 汇总跨依赖顺序，按约束比较调用列表
  - 区分精确顺序、局部顺序与异步完成关系
  - 我用共同父 Mock 收集跨依赖调用，再按业务需要选择精确列表或局部顺序断言。调用过不等于顺序正确，调用开始也不等于异步完成。只有提交前后等真正影响结果的顺序才应该成为测试契约。
  explanation: 外部副作用流程可验证参数、次数和必要顺序，例如先提交再发送成功事件。若业务允许额外的日志或统计调用，就不要把这些实现细节都塞进严格列表；应针对真正的依赖建立断言。assert_has_calls 默认要求指定调用按顺序连续出现，但列表前后允许其他调用，any_order=True 则不要求顺序。选择方法前要先写清楚验收约束。
  id: mock-call-order-oral
  topicId: mock-call-order
