topicId: sqlite-index-plan
questions:
- type: mcq
  prompt: 看到查询使用索引，能直接断定性能已经改善吗？
  choices:
  - id: a
    text: 能，所有索引访问都比全表扫描快
  - id: b
    text: 只要索引名称足够短就能
  - id: c
    text: 不能，仍需测量代表性负载与写入成本
  correct: c
  explanation: 复合索引按列顺序组织键，查询是否能有效利用它取决于条件和排序方式。例如索引 (status, created, id) 可帮助按固定状态、时间与编号读取记录，但不保证任意只过滤末列的查询都同样高效。覆盖索引包含查询所需的列，可以减少回表。执行计划中的 SCAN 与 SEARCH 描述访问方式，不等于慢与快的最终裁决，小表全扫可能比走索引更合理。
  id: sqlite-index-plan-mcq
  topicId: sqlite-index-plan
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "import sqlite3\ndb = sqlite3.connect(':memory:')\ntry:\n    db.executescript(\"CREATE TABLE t(id INTEGER, status TEXT); CREATE INDEX idx_status_id ON t(status, id);\")\n    db.executemany('INSERT INTO t VALUES (?, ?)', [(1, 'done'), (2, 'new'), (3, 'new')])\n    sql = 'SELECT id FROM t INDEXED BY idx_status_id WHERE status=? ORDER BY id'\n    plan = db.execute('EXPLAIN QUERY PLAN ' + sql, ('new',)).fetchall()\n    print(any('idx_status_id' in row[3] for row in plan))\n    print(db.execute(sql, ('new',)).fetchall())\nfinally:\n    db.close()\n"
  answer: 'True

    [(2,), (3,)]'
  explanation: 我从实际查询和数据分布设计索引，用执行计划解释访问路径，用代表性负载验证收益，并计算写入代价。示例的 INDEXED BY 是演示约束，不能当成自动优化证据；计划文本也不作为跨版本固定输出。
  id: sqlite-index-plan-output
  topicId: sqlite-index-plan
- type: debug
  prompt: 这个性能测试为什么不足以证明新增索引有效？
  code: 'start = time.perf_counter()

    db.execute(''SELECT * FROM t WHERE status=?'', (''new'',)).fetchall()

    assert time.perf_counter() - start < 0.01'
  rubric:
  - 先验证查询结果，再在代表性数据与参数上比较计划和耗时
  - 区分演示强制索引与优化器选择，避免固定计划文本和毫秒阈值
  explanation: 执行计划文本是诊断接口，SQLite 版本之间可能改变格式，不适合逐字断言整段文本。索引存在也不代表会被使用；表达式、排序、选择性、统计信息都可能影响决定。数据量变化后应重新验证。不要把一次冷热缓存混杂的耗时当成稳定提升，也不要在测试里用毫秒阈值替代语义正确性断言；先验证结果，再做独立的性能实验。
  id: sqlite-index-plan-debug
  topicId: sqlite-index-plan
- type: oral
  prompt: 你会怎样验证一个复合索引有效，而不是只证明它存在？
  rubric:
  - 先验证查询结果，再在代表性数据与参数上比较计划和耗时
  - 区分演示强制索引与优化器选择，避免固定计划文本和毫秒阈值
  - 我从实际查询和数据分布设计索引，用执行计划解释访问路径，用代表性负载验证收益，并计算写入代价。示例的 INDEXED BY 是演示约束，不能当成自动优化证据；计划文本也不作为跨版本固定输出。
  explanation: 先记录慢查询和参数分布，再构造接近实际规模的数据，查看计划、运行次数和尾延迟。示例用 INDEXED BY 明确要求使用已知索引，目的是观察计划里出现该索引以及查询结果，不能据此证明优化器自然会选择它。实际产品应去掉强制条件再测量。新增索引还要比较插入更新成本、数据库大小和缓存命中，避免给每个字段单独建一个索引。
  id: sqlite-index-plan-oral
  topicId: sqlite-index-plan
