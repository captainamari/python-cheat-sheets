topicId: datetime-zones
questions:
- type: mcq
  prompt: 把同一时间点转换为另一时区展示，应优先使用什么？
  choices:
  - id: a
    text: astimezone
  - id: b
    text: 直接 replace(hour=...)
  - id: c
    text: 删除 tzinfo 再假定它是当地时间
  correct: a
  explanation: datetime 的 tzinfo 决定它是否具有足够的偏移信息。astimezone 转换同一时间点的展示时区，replace(tzinfo=...) 则是附加或替换解释信息，两者不是同一种操作。ZoneInfo 根据时区规则提供日期对应的偏移；夏令时切换意味着某些当地时间会重复或根本不存在。
  id: datetime-zones-mcq
  topicId: datetime-zones
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: 'from datetime import datetime, timezone, timedelta

    utc = datetime(2025, 1, 1, 0, 0, tzinfo=timezone.utc)

    local = utc.astimezone(timezone(timedelta(hours=8)))

    print(local.isoformat())

    print(local == utc)

    '
  answer: '2025-01-01T08:00:00+08:00

    True'
  explanation: 我区分时间点、当地日历规则和经过时长。记录时间点采用明确时区，展示使用转换，测量时长使用单调时钟。replace 不是时区换算；边界测试包括跨日、偏移变化、重复小时与缺失时间。
  id: datetime-zones-output
  topicId: datetime-zones
- type: debug
  prompt: 把 UTC 时间直接换 tzinfo 为东八区，为什么改变了所表示的时间点？
  code: 'from datetime import datetime, timezone, timedelta

    utc = datetime(2025, 1, 1, tzinfo=timezone.utc)

    wrong = utc.replace(tzinfo=timezone(timedelta(hours=8)))'
  rubric:
  - 区分时间点转换与仅替换时区解释信息
  - 使用 astimezone 并测试跨日、夏令时和 naive 输入边界
  explanation: 对 naive 时间直接调用时区转换可能依赖运行环境的本地时区，部署换机器后结果变化。遇到重复小时，fold 用于区分重叠的两次时间，但处理用户输入的不存在时间仍需显式校验或约定。不能只检查字符串带有日期，就假设它已经表示全局唯一时间点。
  id: datetime-zones-debug
  topicId: datetime-zones
- type: oral
  prompt: 每天当地时间执行和每隔二十四小时执行，为什么不是同一需求？
  rubric:
  - 区分时间点转换与仅替换时区解释信息
  - 使用 astimezone 并测试跨日、夏令时和 naive 输入边界
  - 我区分时间点、当地日历规则和经过时长。记录时间点采用明确时区，展示使用转换，测量时长使用单调时钟。replace 不是时区换算；边界测试包括跨日、偏移变化、重复小时与缺失时间。
  explanation: 事件记录适合保存带明确偏移的时间点，按用户时区展示。每天当地时间九点执行的任务却是日历规则，不能简单每隔二十四小时触发来替代，因为夏令时会改变与 UTC 的关系。延迟、超时和性能测量通常使用单调时钟，避免系统时钟调整影响持续时间判断。
  id: datetime-zones-oral
  topicId: datetime-zones
