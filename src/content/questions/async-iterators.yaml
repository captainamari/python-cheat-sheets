topicId: async-iterators
questions:
- type: mcq
  prompt: async for 循环体内直接 await process(item)，默认具有什么处理顺序？
  choices:
  - id: a
    text: 自动同时启动所有项
  - id: b
    text: 逐项等待当前处理后再继续循环
  - id: c
    text: 无需任何限制就自动形成固定线程池
  correct: b
  explanation: 异步可迭代对象通过 __aiter__ 提供异步迭代器，__anext__ 返回可等待对象，结束时抛 StopAsyncIteration。async for 把这些步骤组织成循环，每次获取下一项都可能等待 I/O。异步生成器用 async def 和 yield 同时表达按需产出与异步等待，而不是先把全部结果收集成列表。
  id: async-iterators-mcq
  topicId: async-iterators
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "import asyncio\nasync def rows():\n    for value in range(3):\n        yield value\nasync def main():\n    result = []\n    async for value in rows():\n        result.append(value * 2)\n    print(result)\nasyncio.run(main())\n"
  answer: '[0, 2, 4]'
  explanation: async for 解决异步逐项取值，不自动提供并发处理。我先确定消费速度、容量和关闭责任，再决定是否增加 worker。验证要覆盖流耗尽、提前退出、取消和下游变慢，确保资源不会留在后台。
  id: async-iterators-output
  topicId: async-iterators
- type: debug
  prompt: 每项都 create_task 导致内存增长，异步迭代本身缺少什么保证？
  code: "async for item in stream:\n    asyncio.create_task(process(item))"
  rubric:
  - 区分异步取值协议与并发处理策略
  - 增加有界调度并在提前退出或取消时明确关闭数据源
  explanation: 循环提前 break 后，拥有外部资源的异步生成器应明确关闭，可以配合 contextlib.aclosing，让清理在当前任务上下文中完成。异步生成器不能用非空 return 返回最终值，也不能直接 yield from。不要把普通迭代器直接用于 async for，异步协议需要真实的可等待取值方法。
  id: async-iterators-debug
  topicId: async-iterators
- type: oral
  prompt: 消费异步生成器时，为什么正常耗尽和提前 break 都需要考虑资源生命周期？
  rubric:
  - 区分异步取值协议与并发处理策略
  - 增加有界调度并在提前退出或取消时明确关闭数据源
  - async for 解决异步逐项取值，不自动提供并发处理。我先确定消费速度、容量和关闭责任，再决定是否增加 worker。验证要覆盖流耗尽、提前退出、取消和下游变慢，确保资源不会留在后台。
  explanation: 读取分页 API、模型流式输出或异步数据库结果时，顺序消费常能自然形成背压，因为下一项只有在调用方继续迭代时才被请求。若每项处理需要并发，应使用有界队列或受控任务集合，避免在循环里无界 create_task。并发消费还必须定义结果顺序与失败传播策略。
  id: async-iterators-oral
  topicId: async-iterators
