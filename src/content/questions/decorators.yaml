topicId: decorators
questions:
  - type: mcq
    prompt: functools.wraps 的主要作用是什么？
    choices:
      - id: a
        text: 自动处理业务异常
      - id: b
        text: 自动缓存函数结果
      - id: c
        text: 复制元数据并保留原函数入口
      - id: d
        text: 自动转发所有实参
    correct: c
    explanation: wraps 更新包装函数的常用元数据并设置 __wrapped__。参数转发、返回值和异常处理仍由包装器代码负责。
    id: decorators-mcq
    topicId: decorators
  - type: output
    prompt: 这个装饰器应用后，输出结果是什么？
    code:
      "def twice(fn):\n    def wrap(*args):\n        return fn(*args) * 2\n    return wrap\n@twice\n\
      def number():\n    return 3\nprint(number())"
    answer: '6'
    explanation: 装饰后的 number 绑定到 wrap；wrap 调用原函数取得 3，再乘以 2 返回 6。
    id: decorators-output
    topicId: decorators
  - type: debug
    prompt: 调用有返回值的函数后结果变成 None，应该修复哪里？
    code:
      "def logged(fn):\n    def wrapper(*args, **kwargs):\n        print(\"call\")\n        fn(*args,\
      \ **kwargs)\n    return wrapper"
    rubric:
      - 补上 return fn(*args, **kwargs)
      - 使用 wraps 保留元数据
      - 测试返回值、关键字参数以及异常仍然传播
    explanation: 原函数的结果被 wrapper 丢弃了。元数据保留是另一个问题，两者都应验证，但 wraps 不会自动修复缺失的 return。
    id: decorators-debug
    topicId: decorators
  - type: oral
    prompt: 怎样为异步函数编写计时装饰器？
    rubric:
      - wrapper 使用 async def 并 await 原函数
      - 在 finally 记录耗时并继续传播异常或取消
      - 保留元数据并测试参数和返回值
    explanation: 计时必须覆盖 await 的执行阶段。只创建协程对象后立即结束计时，会漏掉真正的异步工作。
    id: decorators-oral
    topicId: decorators
