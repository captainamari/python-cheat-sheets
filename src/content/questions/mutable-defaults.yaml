topicId: mutable-defaults
questions:
  - type: mcq
    prompt: 函数默认参数表达式通常在什么时候求值？
    choices:
      - id: a
        text: 每次省略参数调用时
      - id: b
        text: 第一次执行函数体时
      - id: c
        text: 执行函数定义语句时
      - id: d
        text: 函数返回之前求值
    correct: c
    explanation: 执行 def 时会求值默认参数并保存结果。后续省略该参数的调用会复用这个默认值。
    id: mutable-defaults-mcq
    topicId: mutable-defaults
  - type: output
    prompt: 连续调用后，这两行输出分别是什么？
    code: "def push(x, values=[]):\n    values.append(x)\n    return len(values)\nprint(push(3))\nprint(push(4))"
    answer: '1

      2'
    explanation: 两次调用复用同一个默认列表。第一次追加后长度为 1，第二次继续追加后长度为 2。
    id: mutable-defaults-output
    topicId: mutable-defaults
  - type: debug
    prompt: 接口承诺使用调用方传入的列表，下面写法为什么会违背承诺？
    code: "def push(x, values=None):\n    values = values or []\n    values.append(x)\n    return values"
    rubric:
      - 空列表是假值，会被 or 替换
      - 改为 if values is None 再创建列表
      - 验证显式传入空列表的对象身份和内容
    explanation: or 检查真假值，不能区分缺省参数与显式空容器。应使用身份判断保留调用方给出的列表。
    id: mutable-defaults-debug
    topicId: mutable-defaults
  - type: oral
    prompt: 如何解释可变默认参数问题？什么时候需要自定义哨兵？
    rubric:
      - 说明定义时求值与默认对象复用
      - 给出 None 哨兵修复及显式空列表测试
      - 当 None 是合法输入时使用独立哨兵
    explanation: 答案需要覆盖求值时机、对象是否共享和接口的缺省语义，而不仅是记住“不要写空列表”。
    id: mutable-defaults-oral
    topicId: mutable-defaults
