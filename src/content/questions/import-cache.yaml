topicId: import-cache
questions:
- type: mcq
  prompt: 连续两次普通 import 同一已成功加载的模块，通常会怎样？
  choices:
  - id: a
    text: 每次创建全新模块并重跑所有顶层代码
  - id: b
    text: 自动清理模块中的可变全局状态
  - id: c
    text: 复用 sys.modules 中的模块对象
  correct: c
  explanation: 导入过程查找模块、创建模块对象并执行顶层代码，成功后后续导入通常复用缓存。from module import value 把当时解析到的对象绑定到当前命名空间，之后原模块重新绑定 value，不会自动改变这份绑定。对同一个可变对象的原地修改则可能被两边同时观察到。
  id: import-cache-mcq
  topicId: import-cache
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: 'import math

    import importlib

    other = importlib.import_module(''math'')

    print(math is other)

    from math import pi

    old = pi

    print(old == math.pi)

    '
  answer: 'True

    True'
  explanation: 导入缓存使模块对象与顶层状态复用。测试隔离应针对显式初始化边界，而不是假定重复导入等于重新启动。我会区分模块属性访问和 from 绑定，并减少导入时副作用，必要时用独立进程验证真实启动流程。
  id: import-cache-output
  topicId: import-cache
- type: debug
  prompt: 测试修改环境变量后配置仍未变化，应该检查什么边界？
  code: '# settings.py

    import os

    ENDPOINT = os.getenv(''ENDPOINT'', ''default'')

    # 测试在首次 import settings 之后才修改环境变量'
  rubric:
  - 说明导入缓存和顶层求值的生命周期
  - 将配置读取改为显式调用并隔离环境输入
  explanation: 随意删除 sys.modules 并重新导入会产生新模块对象，其他地方仍可能持有旧模块或旧类实例。reload 也不是清空所有引用的魔法；从旧模块导入的名称和已创建对象不会自动全部迁移。遇到循环导入时，模块可能只有部分初始化状态，应调整职责边界而非不断移动 import 碰运气。
  id: import-cache-debug
  topicId: import-cache
- type: oral
  prompt: 为什么 reload 不能保证所有依赖模块和已有实例都获得全新状态？
  rubric:
  - 说明导入缓存和顶层求值的生命周期
  - 将配置读取改为显式调用并隔离环境输入
  - 导入缓存使模块对象与顶层状态复用。测试隔离应针对显式初始化边界，而不是假定重复导入等于重新启动。我会区分模块属性访问和 from 绑定，并减少导入时副作用，必要时用独立进程验证真实启动流程。
  explanation: 测试把环境变量改掉再 import 配置模块，可能仍然读到首次加载时缓存的配置。更易测试的方式是把配置读取放进显式函数或构造器，并把结果传给业务对象。模块导入时尽量避免发请求、启动线程或打开连接，让应用入口负责生命周期，测试才能控制何时初始化。
  id: import-cache-oral
  topicId: import-cache
