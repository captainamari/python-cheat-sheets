topicId: slice-semantics
questions:
- type: mcq
  prompt: 想保留原列表身份并替换所有内容，应该使用什么？
  choices:
  - id: a
    text: values = replacement
  - id: b
    text: values = values[:] 后再重绑定
  - id: c
    text: values[:] = replacement
  correct: c
  explanation: values[start:stop:step] 按左闭右开的范围选取元素，负下标和负步长用于从末尾或反向访问。列表读取切片会创建外层新列表，但元素引用仍共享。values[:] = replacement 保留原列表身份并替换内容，而 values = replacement 只把当前名称绑定到另一对象。
  id: slice-semantics-mcq
  topicId: slice-semantics
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: 'values = [0, 1, 2, 3]

    alias = values

    part = values[1:3]

    values[1:3] = [9]

    print(alias)

    print(part)

    print(values is alias)

    '
  answer: '[0, 9, 3]

    [1, 2]

    True'
  explanation: 我区分切片读取、原地切片赋值和名称重绑定。读取只浅拷贝外层，赋值会影响别名；扩展切片还要求长度匹配。测试同时看对象身份、内容和长度，不能只看打印出来的几个元素。
  id: slice-semantics-output
  topicId: slice-semantics
- type: debug
  prompt: 其他模块仍看到旧列表内容，重绑定和原地修改的区别是什么？
  code: 'shared = [1, 2]

    alias = shared

    shared = [3, 4]

    print(alias)'
  rubric:
  - 区分切片浅拷贝、原地修改与名称重绑定
  - 按共享契约选择更新方式并验证身份、长度和内容
  explanation: 单元素索引越界会报 IndexError，普通切片超出两端通常会被裁剪，因此切片不能代替严格长度校验。步长为零无效；步长不为一时，被替换元素数量必须匹配。空切片赋值可插入元素，这种能力适合列表编辑，却可能让以为只会替换的调用方意外改变长度。
  id: slice-semantics-debug
  topicId: slice-semantics
- type: oral
  prompt: 为什么普通切片越界不报错，不能用来证明输入长度足够？
  rubric:
  - 区分切片浅拷贝、原地修改与名称重绑定
  - 按共享契约选择更新方式并验证身份、长度和内容
  - 我区分切片读取、原地切片赋值和名称重绑定。读取只浅拷贝外层，赋值会影响别名；扩展切片还要求长度匹配。测试同时看对象身份、内容和长度，不能只看打印出来的几个元素。
  explanation: 多个组件持有同一个列表时，原地更新可以保留共享句柄，但也会让观察者同时看到变化。若接口承诺返回独立结果，就应创建新列表并明确嵌套元素是否共享。使用切片删除批量元素时要核对范围与步长，尤其是代码从用户参数构造切片时，需要定义边界和负值策略。
  id: slice-semantics-oral
  topicId: slice-semantics
