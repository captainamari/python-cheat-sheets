topicId: dataclass-fields
questions:
- type: mcq
  prompt: frozen=True 的 dataclass 包含 list 字段时，哪项正确？
  choices:
  - id: a
    text: 所有嵌套对象都会自动冻结
  - id: b
    text: 列表内容仍可能被修改
  - id: c
    text: 错误类型的构造参数会自动被拒绝
  correct: b
  explanation: dataclass 根据带注解的字段生成 __init__、__repr__ 和比较方法，具体生成行为由参数控制。default_factory 在每次需要默认值时调用，避免实例共享同一个容器。类型注解描述契约，不会自动阻止错误类型传入。frozen=True 对通常的字段赋值施加限制，却不能让内部列表变成元组。
  id: dataclass-fields-mcq
  topicId: dataclass-fields
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "from dataclasses import dataclass, field\n@dataclass(frozen=True)\nclass Batch:\n    items: list[int] = field(default_factory=list)\na, b = Batch(), Batch()\na.items.append(1)\nprint(a.items, b.items)\nprint(a.items is b.items)\n"
  answer: '[1] []

    False'
  explanation: dataclass 主要生成样板方法，不负责完整验证和深度不可变。容器默认值交给工厂，冻结对象还要选择不可变字段。我会分开测试默认值隔离、相等语义和边界输入，避免把注解当运行时校验。
  id: dataclass-fields-output
  topicId: dataclass-fields
- type: debug
  prompt: 下面的冻结对象为什么不能保证 tags 永远不变？
  code: "from dataclasses import dataclass\n@dataclass(frozen=True)\nclass Item:\n    tags: list[str]\nitem = Item([])\nitem.tags.append('new')"
  rubric:
  - 区分字段重绑定限制与嵌套对象可变性
  - 采用不可变字段并测试默认工厂的实例隔离
  explanation: 冻结实例中的列表仍然可以 append，复制数据类也不等于深拷贝所有嵌套资源。asdict 会递归转换并涉及拷贝，不适合作为所有对象的零成本序列化接口。大型结构的导出应明确字段与转换规则，尤其不要无意把内部凭证或不可序列化的连接对象带入返回结果。
  id: dataclass-fields-debug
  topicId: dataclass-fields
- type: oral
  prompt: 将 dataclass 作为值对象时，如何设计默认值、比较和校验规则？
  rubric:
  - 区分字段重绑定限制与嵌套对象可变性
  - 采用不可变字段并测试默认工厂的实例隔离
  - dataclass 主要生成样板方法，不负责完整验证和深度不可变。容器默认值交给工厂，冻结对象还要选择不可变字段。我会分开测试默认值隔离、相等语义和边界输入，避免把注解当运行时校验。
  explanation: 请求配置或业务值对象适合使用 dataclass 减少重复代码，但仍应在边界完成数据解析与校验。需要稳定可哈希的键时，要确认每个字段都符合哈希契约，不能只打开 unsafe_hash 就忽略可变状态。字段中存放缓存、连接或日志器时，也要考虑它是否应参与 repr 和相等比较。
  id: dataclass-fields-oral
  topicId: dataclass-fields
