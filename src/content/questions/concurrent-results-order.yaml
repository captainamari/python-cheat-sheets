topicId: concurrent-results-order
questions:
- type: mcq
  prompt: 想及时处理已完成任务并保留正确输入关联，应该怎样做？
  choices:
  - id: a
    text: 把 as_completed 结果直接与原输入 zip
  - id: b
    text: as_completed 配合 Future 到任务 ID 的映射
  - id: c
    text: 认为所有并发 API 都按输入顺序返回
  correct: b
  explanation: 并发执行顺序、完成顺序和结果展示顺序是三个概念。map 即使后面任务先完成，也会按输入位置依次给调用者结果；as_completed 则让已完成 Future 先被消费。多个 Future 在开始迭代前都已完成时，不应依赖它们之间的细微顺序作为稳定业务规则。
  id: concurrent-results-order-mcq
  topicId: concurrent-results-order
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "from concurrent.futures import ThreadPoolExecutor, as_completed\nfrom threading import Event\nrelease = Event()\ndef slow():\n    release.wait()\n    return 'slow'\nwith ThreadPoolExecutor(max_workers=2) as pool:\n    first = pool.submit(slow)\n    second = pool.submit(str, 'fast')\n    second.result()\n    ready = as_completed([first, second])\n    print(next(ready).result())\n    release.set()\n    print(next(ready).result())\n"
  answer: 'fast

    slow'
  explanation: 我根据需求选择结果消费顺序，并始终保存任务身份。实时进度用完成顺序，稳定报告再显式排序。测试构造可控快慢任务和失败项，确认结果不会错配，也不会因一个慢任务掩盖其他已完成工作。
  id: concurrent-results-order-output
  topicId: concurrent-results-order
- type: debug
  prompt: 结果贴错了任务名称，顺序假设错在哪里？
  code: "for name, future in zip(names, as_completed(futures)):\n    report(name, future.result())"
  rubric:
  - 区分提交、完成与展示三种顺序
  - 维护 Future 到业务 ID 的映射，并测试可控乱序与失败项
  explanation: 按输入顺序消费可能产生队首阻塞，但换成完成顺序并不自动解决提交数量过大、超时和取消问题。每个任务失败仍需取回异常，结果集合是否允许部分成功要明确。示例用同步事件控制快慢关系，避免依赖 sleep 或机器速度来猜测哪个任务先结束。
  id: concurrent-results-order-debug
  topicId: concurrent-results-order
- type: oral
  prompt: 实时进度与最终稳定报告怎样同时支持不同的结果顺序？
  rubric:
  - 区分提交、完成与展示三种顺序
  - 维护 Future 到业务 ID 的映射，并测试可控乱序与失败项
  - 我根据需求选择结果消费顺序，并始终保存任务身份。实时进度用完成顺序，稳定报告再显式排序。测试构造可控快慢任务和失败项，确认结果不会错配，也不会因一个慢任务掩盖其他已完成工作。
  explanation: 批量测试报告可以实时按完成顺序显示进度，最后再按用例 ID 或输入序号整理结果。需要把 Future 映射到原任务，捕获异常时才能报告正确对象。若直接 zip 输入列表与 as_completed 的结果，就可能把某个任务的输出贴到另一个输入上，形成难以发现的数据错配。
  id: concurrent-results-order-oral
  topicId: concurrent-results-order
