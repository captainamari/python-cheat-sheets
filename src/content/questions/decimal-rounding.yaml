topicId: decimal-rounding
questions:
- type: mcq
  prompt: 希望精确表达十进制输入 0.1，应该怎样构造？
  choices:
  - id: a
    text: Decimal('0.1')
  - id: b
    text: Decimal(0.1)
  - id: c
    text: 先转 float 再转 Decimal
  correct: a
  explanation: 二进制浮点不能精确表达许多十进制小数。Decimal 从字符串构造时保留文本表示的十进制值，从 float 构造则精确接收该浮点数实际代表的值，可能出现很长的小数尾部。运算受上下文精度影响，quantize 用目标指数限定小数位，并按指定的舍入策略处理边界。
  id: decimal-rounding-mcq
  topicId: decimal-rounding
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: 'from decimal import Decimal, ROUND_HALF_UP

    value = Decimal(''2.675'')

    print(value.quantize(Decimal(''0.01''), rounding=ROUND_HALF_UP))

    print(Decimal(''0.1'') + Decimal(''0.2'') == Decimal(''0.3''))

    print(Decimal(0.1) == Decimal(''0.1''))

    '
  answer: '2.68

    True

    False'
  explanation: 金额计算先统一输入类型，再定义精度和舍入时点。Decimal 从字符串构造能保留十进制意图，quantize 明确小数位和舍入模式。我会覆盖半分边界、负数、累计舍入差异，并拒绝不合法的非有限金额。
  id: decimal-rounding-output
  topicId: decimal-rounding
- type: debug
  prompt: 费用计算仍出现意外小数尾部，输入边界有什么问题？
  code: 'from decimal import Decimal

    amount = Decimal(float(''0.1''))

    print(amount)'
  rubric:
  - 区分十进制字符串构造与接收浮点近似值
  - 从原始字符串构造并显式量化、测试舍入边界
  explanation: Decimal 并不自动决定业务上的四舍五入规则，也不能绕开非有限值校验。需要显式处理 NaN、Infinity、非法币种精度以及溢出的金额。不要把显示格式的小数位数当作计算精度。示例选择 ROUND_HALF_UP 是一种指定规则，并不意味着所有财务场景都应采用它。
  id: decimal-rounding-debug
  topicId: decimal-rounding
- type: oral
  prompt: 逐笔舍入和汇总后舍入为什么可能不同，如何把规则写进接口？
  rubric:
  - 区分十进制字符串构造与接收浮点近似值
  - 从原始字符串构造并显式量化、测试舍入边界
  - 金额计算先统一输入类型，再定义精度和舍入时点。Decimal 从字符串构造能保留十进制意图，quantize 明确小数位和舍入模式。我会覆盖半分边界、负数、累计舍入差异，并拒绝不合法的非有限金额。
  explanation: 支付费用应在接口层统一金额表示，在计算规则里说明何时量化，例如逐笔舍入与合计后舍入可能有不同结果。使用 localcontext 临时调整精度，避免修改全局上下文影响无关计算。数据库和 JSON 边界也要保持一致，常见做法是传递十进制字符串或以整数保存最小货币单位。
  id: decimal-rounding-oral
  topicId: decimal-rounding
