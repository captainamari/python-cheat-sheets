topicId: cache-lifecycle
questions:
- type: mcq
  prompt: 关于 lru_cache，哪项描述正确？
  choices:
  - id: a
    text: 默认会按分钟自动过期
  - id: b
    text: 自动保证同一键并发只执行一次
  - id: c
    text: 命中时可能返回同一个可变结果对象
  correct: c
  explanation: 缓存键由调用参数构成，结果对象会被保留直到被淘汰或清空。参数需要可哈希，返回值却可以是可变对象；多次命中会拿到同一个缓存结果，而不是新副本。maxsize 控制保留数量，cache_info 帮助观察命中与容量，cache_clear 则显式移除内容。
  id: cache-lifecycle-mcq
  topicId: cache-lifecycle
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "from functools import lru_cache\n@lru_cache(maxsize=2)\ndef values(key):\n    return [key]\na = values('x')\na.append('changed')\nprint(values('x'))\nprint(values.cache_info().hits)\nvalues.cache_clear()\nprint(values('x'))\n"
  answer: '[''x'', ''changed'']

    1

    [''x'']'
  explanation: 缓存改变了对象生命周期和一致性语义。使用 lru_cache 前我确认参数可哈希、结果能共享、数据何时失效，并监控命中和容量。它不是 TTL 缓存，也不是同键并发合并机制；副作用函数不宜随意缓存。
  id: cache-lifecycle-output
  topicId: cache-lifecycle
- type: debug
  prompt: 缓存列表被调用方修改后影响下一次请求，应该怎样设计？
  code: 'from functools import lru_cache

    @lru_cache

    def options(): return [''default'']

    options().append(''private'')

    print(options())'
  rubric:
  - 说明缓存延长结果生命周期并共享对象
  - 选择不可变结果或明确复制，同时设计容量和失效
  explanation: 缓存内部结构的线程安全不意味着并发相同请求一定只执行一次，首次计算重叠时可能发生重复调用。异步函数直接装上 lru_cache 会缓存协程对象，重复 await 已消费的协程会出问题。可变返回值也可能被调用者污染，适合返回不可变数据，或在边界明确复制成本。
  id: cache-lifecycle-debug
  topicId: cache-lifecycle
- type: oral
  prompt: 为后端配置查询加缓存时，除了命中率还要回答哪些问题？
  rubric:
  - 说明缓存延长结果生命周期并共享对象
  - 选择不可变结果或明确复制，同时设计容量和失效
  - 缓存改变了对象生命周期和一致性语义。使用 lru_cache 前我确认参数可哈希、结果能共享、数据何时失效，并监控命中和容量。它不是 TTL 缓存，也不是同键并发合并机制；副作用函数不宜随意缓存。
  explanation: 纯函数或相对稳定的元数据适合缓存。数据库查询、权限结果与带用户上下文的函数应把必要上下文纳入键，并制定失效策略。标准 lru_cache 没有内置 TTL，不能把“限制条目数”解释成“过几分钟会刷新”。需要时间语义时，选择明确支持到期机制的设计或主动清理。
  id: cache-lifecycle-oral
  topicId: cache-lifecycle
