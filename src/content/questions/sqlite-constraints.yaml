topicId: sqlite-constraints
questions:
- type: mcq
  prompt: CHECK(amount > 0) 能否单独阻止 amount 为 NULL？
  choices:
  - id: a
    text: 不能，还需要 NOT NULL
  - id: b
    text: 能，NULL 自动视为零
  - id: c
    text: 只要有主键就能
  correct: a
  explanation: 应用校验能提供友好反馈，数据库约束则在实际写入边界执行。NOT NULL 拒绝缺失值，CHECK 拒绝结果为零的表达式；CHECK 的结果为 NULL 时不会拒绝，所以 CHECK(amount > 0) 不能替代 NOT NULL。UNIQUE 防止重复键，外键维护引用关系。SQLite 的外键开关属于连接配置，通常需要在事务外执行 PRAGMA foreign_keys=ON，并读取其结果确认，而不是只在建表语句里声明 REFERENCES。
  id: sqlite-constraints-mcq
  topicId: sqlite-constraints
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "import sqlite3\ndb = sqlite3.connect(':memory:')\ntry:\n    db.execute('PRAGMA foreign_keys=ON')\n    db.executescript('CREATE TABLE p(id INTEGER PRIMARY KEY); CREATE TABLE c(pid INTEGER REFERENCES p(id), amount INTEGER NOT NULL CHECK(amount > 0));')\n    print(db.execute('PRAGMA foreign_keys').fetchone()[0])\n    try:\n        db.execute('INSERT INTO c VALUES (9, 1)')\n    except sqlite3.IntegrityError:\n        print('rejected')\n    db.execute('INSERT INTO p VALUES (9)')\n    db.execute('INSERT INTO c VALUES (9, 1)')\n    print(db.execute('SELECT COUNT(*) FROM c').fetchone()[0])\nfinally:\n    db.close()\n"
  answer: '1

    rejected

    1'
  explanation: 我把不可违反的记录规则放到数据库约束，同时保留应用层校验。SQLite 每个连接显式开启并验证外键，CHECK 配合 NOT NULL 使用，唯一键承担并发写入时的最后防线。约束异常按业务语义处理。
  id: sqlite-constraints-output
  topicId: sqlite-constraints
- type: debug
  prompt: 声明了外键却接受孤立子记录，连接初始化缺了什么？
  code: 'db = sqlite3.connect(''app.db'')

    db.execute(''INSERT INTO child(parent_id) VALUES (999)'')'
  rubric:
  - 在事务外对每个连接启用外键并查询开关验证
  - 区分 CHECK 与 NOT NULL，并测试合法和非法写入
  explanation: 连接上下文负责提交或回滚，不负责关闭连接。PRAGMA foreign_keys 在多语句事务中切换不会产生期待效果，因此连接初始化顺序很重要。约束还不能自动表达所有跨行业务规则，例如账户余额与多笔流水的整体一致性仍需合适的事务边界。测试必须覆盖真实连接初始化路径，不能只在测试专用连接上启用外键而漏掉产品代码。
  id: sqlite-constraints-debug
  topicId: sqlite-constraints
- type: oral
  prompt: 应用校验和数据库约束如何分工，SQLite 连接配置有哪些容易遗漏的地方？
  rubric:
  - 在事务外对每个连接启用外键并查询开关验证
  - 区分 CHECK 与 NOT NULL，并测试合法和非法写入
  - 我把不可违反的记录规则放到数据库约束，同时保留应用层校验。SQLite 每个连接显式开启并验证外键，CHECK 配合 NOT NULL 使用，唯一键承担并发写入时的最后防线。约束异常按业务语义处理。
  explanation: 订单写入可以把金额非空且大于零、请求编号唯一、客户必须存在分别编码成约束。示例先打开外键，插入不存在的父记录会抛 IntegrityError，随后插入合法父子记录。处理此类异常时应返回有意义的业务冲突，避免把所有约束失败都当成可重试的网络故障。迁移上线前先检查历史数据是否违反新规则；否则建表成功并不代表旧数据能直接迁入。
  id: sqlite-constraints-oral
  topicId: sqlite-constraints
