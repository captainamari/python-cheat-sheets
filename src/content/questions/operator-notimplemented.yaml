topicId: operator-notimplemented
questions:
- type: mcq
  prompt: __add__ 不支持当前另一方类型，希望允许反向方法尝试，应如何处理？
  choices:
  - id: a
    text: 抛出 NotImplementedError
  - id: b
    text: 返回 False 表示继续寻找
  - id: c
    text: 返回 NotImplemented
  correct: c
  explanation: 自定义 __add__、__eq__ 等方法时，遇到不支持的另一种类型，可以返回单例 NotImplemented。解释器按相应运算规则尝试反向方法或其他后备行为，最后可能报 TypeError，比较还有自己的回退规则。直接抛出 NotImplementedError 会中断这些正常协作机会，不是告诉解释器“请试另一方”。
  id: operator-notimplemented-mcq
  topicId: operator-notimplemented
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "class Left:\n    def __add__(self, other): return NotImplemented\nclass Right:\n    def __radd__(self, other): return 'handled by right'\nprint(Left() + Right())\n"
  answer: handled by right
  explanation: NotImplemented 是运算协议中的协作返回值，NotImplementedError 是立即抛出的异常。我把不支持的类型组合交回解释器，把真实业务错误明确报告。测试覆盖反向运算和比较回退，避免自定义方法破坏其他类型的合作。
  id: operator-notimplemented-output
  topicId: operator-notimplemented
- type: debug
  prompt: 另一方明明实现 __radd__，为什么这段代码阻断了它？
  code: "class Left:\n    def __add__(self, other):\n        raise NotImplementedError()"
  rubric:
  - 区分协议返回标记与普通异常
  - 返回 NotImplemented 参与反向协作，并测试不支持类型组合
  explanation: 不要对 NotImplemented 做真假值判断来决定成功与否，不同版本对此有变化，而且它本来就是协议返回标记。也不要无条件返回 False 来处理所有不认识的相等比较，这可能剥夺另一方定义对称比较的机会。验证需要包括正向、反向、子类和不支持类型，而不只测试两个同类实例。
  id: operator-notimplemented-debug
  topicId: operator-notimplemented
- type: oral
  prompt: 自定义值对象时，类型不支持与业务规则不允许应该如何分别表达？
  rubric:
  - 区分协议返回标记与普通异常
  - 返回 NotImplemented 参与反向协作，并测试不支持类型组合
  - NotImplemented 是运算协议中的协作返回值，NotImplementedError 是立即抛出的异常。我把不支持的类型组合交回解释器，把真实业务错误明确报告。测试覆盖反向运算和比较回退，避免自定义方法破坏其他类型的合作。
  explanation: 数值包装器或领域值对象应只处理自己理解的组合，例如 Money 与相同币种 Money 相加，其他类型返回 NotImplemented。币种不同则可能属于类型兼容但业务规则不允许，应选择明确异常。协议不支持与业务数据非法是两种情况，区分后调用者更容易判断失败原因。
  id: operator-notimplemented-oral
  topicId: operator-notimplemented
