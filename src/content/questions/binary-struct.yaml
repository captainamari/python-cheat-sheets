topicId: binary-struct
questions:
- type: mcq
  prompt: 跨系统协议为什么应谨慎使用默认的 @ 格式前缀？
  choices:
  - id: a
    text: 它总会把数字转为字符串
  - id: b
    text: 它只允许一个字段
  - id: c
    text: 它依赖本机尺寸、字节序和对齐
  correct: c
  explanation: struct 的格式前缀决定字节序、尺寸和对齐。默认 @ 使用本机布局，适合与相同 ABI 的数据结构交互，但不适合不加说明地作为网络协议。> 表示大端、标准尺寸且不加本机对齐，< 表示小端，! 表示网络大端。I 是无符号整数，h 是有符号短整数；示例用 >Ih 编码编号和偏移，固定为六字节，接收方按相同格式恢复。
  id: binary-struct-mcq
  topicId: binary-struct
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: 'import struct

    layout = struct.Struct(''>Ih'')

    blob = layout.pack(258, -2)

    print(layout.size)

    print(blob.hex())

    print(layout.unpack(blob))

    '
  answer: '6

    00000102fffe

    (258, -2)'
  explanation: 我用显式字节序和固定尺寸定义二进制布局，验证长度后再解包。struct 只处理字段与字节的映射，不负责流式组包、版本兼容或业务范围校验。通过十六进制样例和跨语言测试验证双方遵守同一协议。
  id: binary-struct-output
  topicId: binary-struct
- type: debug
  prompt: 下面网络读取为什么可能对正确消息也解包失败？
  code: 'header = sock.recv(6)

    number, offset = struct.unpack(''>Ih'', header)'
  rubric:
  - 明确协议字节序和尺寸，积累足够字节后再解包
  - 验证长度上限、截断和数值范围，区分字段解析与流式组包
  explanation: unpack 要求缓冲区长度与格式匹配，unpack_from 可以从更大的缓冲区指定偏移读取；这两者的边界检查不同。整数字段溢出会报错，不会替你决定截断或饱和策略。字符编码、可选字段、协议版本与校验也不由 struct 自动解决。设计持久格式时应保留版本机制，并对截断数据、超长长度、负值和极值分别写用例。
  id: binary-struct-debug
  topicId: binary-struct
- type: oral
  prompt: 如何用 struct 实现一个可跨平台的二进制消息头，并验证不完整输入？
  rubric:
  - 明确协议字节序和尺寸，积累足够字节后再解包
  - 验证长度上限、截断和数值范围，区分字段解析与流式组包
  - 我用显式字节序和固定尺寸定义二进制布局，验证长度后再解包。struct 只处理字段与字节的映射，不负责流式组包、版本兼容或业务范围校验。通过十六进制样例和跨语言测试验证双方遵守同一协议。
  explanation: 读取消息时先验证头部长度，再解析长度字段，然后检查最大允许值并读取完整负载。socket 的一次 recv 不保证返回指定数量的字节，不能把 unpack 失败简单当成对端发错协议。固定布局可以复用 Struct 对象，并用 calcsize 或 size 维护解析边界。示例同时打印十六进制和恢复后的元组，便于把字节排列与数值一一对应。
  id: binary-struct-oral
  topicId: binary-struct
