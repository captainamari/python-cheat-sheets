topicId: log-assertions
questions:
- type: mcq
  prompt: 为什么日志测试通常优先检查 records 中的稳定字段？
  choices:
  - id: a
    text: 避免时间戳等易变格式干扰业务语义验证
  - id: b
    text: 这样就不需要检查业务异常是否传播
  - id: c
    text: 捕获记录能自动保证生产日志轮转正常
  correct: a
  explanation: assertLogs 在指定记录器及其相关传播范围捕获达到阈值的记录，返回 records 和格式化 output。records 提供 levelno、name 和消息等结构信息，更适合检查语义。没有符合条件的日志会让 assertLogs 失败，这与只读取一段可能为空的输出再忽略它不同。
  id: log-assertions-mcq
  topicId: log-assertions
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "import logging\nimport unittest\ncase = unittest.TestCase()\nlogger = logging.getLogger('s2.events')\nwith case.assertLogs('s2.events', level='WARNING') as captured:\n    logger.warning('job=%s failed', 'a1')\nprint(captured.records[0].levelname)\nprint(captured.records[0].getMessage())\n"
  answer: 'WARNING

    job=a1 failed'
  explanation: 我优先断言日志事件的级别、上下文和次数，而不是整行外观。日志测试与业务结果断言一起使用，确认失败被观察到且没有被吞掉。生产输出配置另外验证，避免把捕获成功等同于真实部署可观测。
  id: log-assertions-output
  topicId: log-assertions
- type: debug
  prompt: 测试因时间戳变化每天失败，断言粒度应该如何调整？
  code: 'assert captured.output == [''2025-01-01 10:00:00 ERROR job failed'']

    # 同一业务失败在不同时间运行'
  rubric:
  - 区分日志事件语义与易变输出格式
  - 断言级别、上下文、次数，并独立验证业务错误传播
  explanation: 断言完整日志行常会把时间、线程名或格式微调变成无意义失败。另一方面，只检查出现某个短词又可能放过错误级别或错误任务。测试应选择稳定字段和关键文本，并确认异常回溯是否按预期保留。捕获处理器也改变局部日志配置，因此它不能证明生产日志输出目标、轮转和权限都正确。
  id: log-assertions-debug
  topicId: log-assertions
- type: oral
  prompt: 日志捕获测试通过后，为什么还需要检查生产处理器和输出配置？
  rubric:
  - 区分日志事件语义与易变输出格式
  - 断言级别、上下文、次数，并独立验证业务错误传播
  - 我优先断言日志事件的级别、上下文和次数，而不是整行外观。日志测试与业务结果断言一起使用，确认失败被观察到且没有被吞掉。生产输出配置另外验证，避免把捕获成功等同于真实部署可观测。
  explanation: 异常边界测试可以确认失败只记录一次、带有任务 ID 和正确级别，并检查业务异常仍然传播。共享库测试通常针对自己的 logger，避免把其他依赖的日志误判成目标事件。正常路径若要求无错误日志，可以用 assertNoLogs 而不是人为检查控制台看起来是否干净。
  id: log-assertions-oral
  topicId: log-assertions
