topicId: pattern-matching
questions:
- type: mcq
  prompt: 在 case SOME_NAME 中，裸名称通常表示什么？
  choices:
  - id: a
    text: 自动比较同名全局常量
  - id: b
    text: 只匹配字符串 SOME_NAME
  - id: c
    text: 捕获并绑定名称
  correct: c
  explanation: 'case {"kind": "job", "id": item_id} 检查映射中的必要字段，并把对应值绑定到 item_id。映射允许存在未列出的其他键，若要限制字段集合需要额外校验。序列模式表达长度和元素结构，字符串与字节等对象不会简单当作普通序列模式拆开匹配。'
  id: pattern-matching-mcq
  topicId: pattern-matching
- type: output
  prompt: 请逐行推演下面代码，写出完整输出。
  code: "def route(value):\n    match value:\n        case {'kind': 'job', 'id': item_id} if item_id > 0:\n            return f'job:{item_id}'\n        case _:\n            return 'unknown'\nprint(route({'kind': 'job', 'id': 2, 'extra': True}))\nprint(route({'kind': 'job', 'id': 0}))\n"
  answer: 'job:2

    unknown'
  explanation: 结构匹配把形状与绑定写在一起，裸名称表示捕获，常量比较需要明确写法。我会给每个分支配守卫与兜底，验证额外字段、错误类型和不匹配输入，确保匹配规则与业务校验各自承担清晰职责。
  id: pattern-matching-output
  topicId: pattern-matching
- type: debug
  prompt: 原本想判断常量却匹配所有输入，应该怎么改？
  code: "SUCCESS = 200\nmatch status:\n    case SUCCESS:\n        print('ok')"
  rubric:
  - 区分捕获模式、字面量与限定名称值模式
  - 为结构匹配补守卫和兜底，并验证未匹配及额外字段
  explanation: case SUCCESS 若 SUCCESS 是裸名称，可能捕获任何值并绑定它，而不是比较预先定义的常量。使用 Status.SUCCESS 等限定名称可以表达值模式。匹配失败过程中临时绑定的细节不宜成为业务依赖；每个分支应只使用明确成功匹配得到的值，避免控制流隐藏未初始化变量。
  id: pattern-matching-debug
  topicId: pattern-matching
- type: oral
  prompt: match 映射模式为何不能直接替代完整的请求体校验？
  rubric:
  - 区分捕获模式、字面量与限定名称值模式
  - 为结构匹配补守卫和兜底，并验证未匹配及额外字段
  - 结构匹配把形状与绑定写在一起，裸名称表示捕获，常量比较需要明确写法。我会给每个分支配守卫与兜底，验证额外字段、错误类型和不匹配输入，确保匹配规则与业务校验各自承担清晰职责。
  explanation: 事件路由可以先按消息结构分支，再用 if 守卫检查版本、范围或权限。例如匹配 amount 后判断 amount > 0，能把结构判断和业务条件分开。面向外部输入时，还应先确认数据来源、类型和字段约束，match 只是控制流工具，不是一套自动生成的完整数据校验器。
  id: pattern-matching-oral
  topicId: pattern-matching
